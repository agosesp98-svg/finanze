name: Deploy Finanze PWA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate stable runtime
        run: |
          node --check db.js
          node --check engine.js
          node --check spendable-guard.js
          node --check app.js
          node --check appearance.js
          node --check insights.js
          node --check projection-details.js
          node --check recurrence-controls.js
          node --check ai-context.js
          node --check ai-chat.js
          node --check cloudflare-ai/worker.js
          node --check plan-patch.js
          node --check goal-priority.js
          node --check plan-update-ui.js
          node --check sw.js
          node --check salary-guide.js
          node --check app-updater.js
      - name: Run financial regression tests
        run: |
          node tests/engine.test.js
          node tests/home.test.js
          node tests/spendable-guard.test.js
          node tests/ai-context.test.js
          node tests/ai-ui.test.js
          node tests/plan-update.test.js
          node tests/plan-import-ui.test.js
          node tests/cloudflare-ai.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
