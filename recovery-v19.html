<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>Aggiornamento Finanze</title><style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:#f5f5f7;color:#111}body{min-height:100svh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(420px,100%);background:#fff;border-radius:28px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.08);text-align:center}.mark{width:58px;height:58px;border-radius:18px;background:#111;color:#fff;display:grid;place-items:center;margin:0 auto 18px;font-size:28px;font-weight:700}h1{margin:0 0 8px;font-size:25px;letter-spacing:-.04em}p{margin:0;color:#6e6e73;font-size:14px;line-height:1.45}.bar{height:6px;background:#e9e9ed;border-radius:99px;overflow:hidden;margin:24px 0 10px}.bar i{display:block;height:100%;width:20%;background:#0a84ff;border-radius:99px;animation:go 1.2s ease-in-out infinite alternate}@keyframes go{to{transform:translateX(320%)}}small{color:#8e8e93;font-size:11px}</style></head><body><main class="card"><div class="mark">€</div><h1>Aggiorno Finanze</h1><p>Sto eliminando solo la cache dell’app. I dati finanziari in IndexedDB non vengono cancellati.</p><div class="bar"><i></i></div><small id="status">Preparazione…</small></main><script>(async()=>{const s=document.getElementById('status');try{s.textContent='Rimuovo la vecchia cache…';if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('finanze-pwa')).map(k=>caches.delete(k)));}s.textContent='Carico la versione nuova…';setTimeout(()=>location.replace('./?v=19&recovered='+Date.now()),500);}catch(e){s.textContent='Riprovo senza cache…';setTimeout(()=>location.replace('./?v=19&recovered='+Date.now()),700);}})();</script></body></html>
